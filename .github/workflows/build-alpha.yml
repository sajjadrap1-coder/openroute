name: Build experimental tunnel binaries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Go build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: openroute-tunnel.exe
          - goos: linux
            goarch: amd64
            artifact: openroute-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build alpha command-line binary (not a VPN)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.artifact }}" ./cmd/openroute-tunnel
      - uses: actions/upload-artifact@v4
        with:
          name: openroute-alpha-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.artifact }}
          retention-days: 14
