name: Go tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l cmd internal | tee /tmp/gofmt-files.txt
      - run: test ! -s /tmp/gofmt-files.txt
      - run: go vet ./...
      - run: go test -race ./...
