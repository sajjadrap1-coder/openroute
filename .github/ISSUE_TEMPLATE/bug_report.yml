name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove personal data, tokens, identifiable IP addresses and credentials before posting."
  - type: input
    id: version
    attributes:
      label: OpenRoute version
      placeholder: 0.1.0-dev
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
