name: Feature request
description: Propose an improvement to a project profile or core engine
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Related profile
      options: [Gaming, Smart Access, AI & Developer, Core / Security, Documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Suggested approach and measurable acceptance criteria
    validations:
      required: true
